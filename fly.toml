# fly.toml app configuration file generated for pricestalk on 2026-06-06T02:59:27+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pricestalk'
primary_region = 'cdg'

[build]

[env]
  DATABASE_URL = 'sqlite:////data/pricestalk.db'
  DEBUG = '0'
  PORT = '8080'
  REFRESH_HOURS = '24'
  RUN_SCHEDULER = '1'

[[mounts]]
  source = 'pricestalk_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
