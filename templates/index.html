<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PriceStalk</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>📉 PriceStalk</h1>
    <span class="sub">Romania · RON · min-price tracker</span>
    <button class="sm" style="margin-left:auto" onclick="checkNotifications()">🔔 Check updates</button>
  </header>
  <main>
    <div class="add-bar">
      <input id="q" type="text" placeholder='New product, e.g. "rtx 5050 laptop"' onkeydown="if(event.key==='Enter')addProduct()">
      <button class="primary" onclick="addProduct()">Add product</button>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" style="display:none">No products yet. Add one above to start stalking prices.</div>
  </main>

  <div id="modalBg" class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modal"></div>
  </div>
  <div id="toast" class="toast"></div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
