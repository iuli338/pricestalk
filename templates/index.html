<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PriceStalk</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="icon" type="image/png" sizes="256x256" href="{{ url_for('static', filename='favicon-256.png') }}">
  <!-- apply saved theme before paint to avoid flash -->
  <script>
    (function(){ var t = localStorage.getItem('theme'); if(t) document.documentElement.setAttribute('data-theme', t); })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/wizard.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="name">Price<span class="accent">Stalk</span></span>
        <span class="tag" data-i18n="app.tag">Romania · RON</span>
      </div>
      <div class="header-actions">
        <select id="langSelect" class="lang-select" data-i18n-title="header.lang" title="Language">
          <option value="en">EN</option>
          <option value="ro">RO</option>
        </select>
        <button class="btn btn-icon" id="themeBtn" title="Toggle theme">◑</button>
        <button class="btn btn-sm user-chip" id="userChip" title="Profile"></button>
      </div>
    </div>
  </header>

  <main>
    <div class="search-wrap">
      <div class="search">
        <input id="q" class="input" type="text"
               data-i18n-ph="search.placeholder"
               placeholder='Add a product, e.g. "rtx 5050 laptop"'>
        <button id="addBtn" class="btn btn-primary" data-i18n="search.add">Add</button>
      </div>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" data-i18n="home.empty" style="display:none">No products yet. Add one above to start tracking.</div>
  </main>

  <footer class="site-footer site-footer-fixed">
    <a href="/disclaimer" data-i18n="footer.disclaimer">Disclaimer</a>
    <a href="/privacy" data-i18n="footer.privacy">Privacy</a>
  </footer>

  <div id="modalBg" class="modal-bg">
    <div class="modal" id="modal"></div>
  </div>
  <div id="toast" class="toast"></div>

  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
