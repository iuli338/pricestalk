<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PriceStalk</title>
  <style>
    :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2e38; --txt:#e6e8ee; --mut:#8a90a0; --acc:#4f8cff; --good:#39d98a; --warn:#ffb454; }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--txt); }
    header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; }
    header h1 { font-size:20px; margin:0; }
    header .sub { color:var(--mut); font-size:13px; }
    main { max-width:1000px; margin:0 auto; padding:24px; }
    .add-bar { display:flex; gap:8px; margin-bottom:24px; }
    input[type=text] { flex:1; padding:10px 12px; background:var(--card); border:1px solid var(--line); border-radius:8px; color:var(--txt); }
    button { padding:9px 14px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--txt); cursor:pointer; }
    button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
    button:hover { filter:brightness(1.15); }
    button.sm { padding:4px 9px; font-size:13px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
    .card h3 { margin:0 0 8px; font-size:16px; }
    .price { font-size:26px; font-weight:700; color:var(--good); }
    .price.none { color:var(--mut); font-size:16px; font-weight:400; }
    .meta { color:var(--mut); font-size:13px; margin:6px 0; }
    .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
    .badge { background:var(--warn); color:#000; border-radius:10px; padding:1px 8px; font-size:12px; font-weight:600; }
    .listing { border-top:1px solid var(--line); padding:8px 0; font-size:13px; }
    .listing a { color:var(--acc); text-decoration:none; }
    .listing .lp { color:var(--good); font-weight:600; }
    .listing .oos { color:var(--warn); }
    .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; }
    .modal-bg.open { display:flex; }
    .modal { background:var(--card); border:1px solid var(--line); border-radius:12px; max-width:720px; width:100%; padding:20px; }
    .modal h2 { margin:0 0 4px; font-size:18px; }
    .result { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:8px 0; display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .result .t { font-size:14px; }
    .result .s { color:var(--mut); font-size:12px; }
    .muted { color:var(--mut); }
    .close { float:right; }
    .empty { color:var(--mut); text-align:center; padding:60px 0; }
    .toast { position:fixed; right:20px; bottom:20px; background:var(--card); border:1px solid var(--acc); border-radius:10px; padding:12px 16px; display:none; }
    .toast.show { display:block; }
  </style>
</head>
<body>
  <header>
    <h1>📉 PriceStalk</h1>
    <span class="sub">Romania · RON · min-price tracker</span>
    <button class="sm" style="margin-left:auto" onclick="checkNotifications()">🔔 Check updates</button>
  </header>
  <main>
    <div class="add-bar">
      <input id="q" type="text" placeholder='New product, e.g. "rtx 5050 laptop"' onkeydown="if(event.key==='Enter')addProduct()">
      <button class="primary" onclick="addProduct()">Add product</button>
    </div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" style="display:none">No products yet. Add one above to start stalking prices.</div>
  </main>

  <div id="modalBg" class="modal-bg" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modal"></div>
  </div>
  <div id="toast" class="toast"></div>

<script>
const $ = s => document.querySelector(s);
const api = (url, opt) => fetch(url, opt).then(r => r.json());
const fmt = p => p == null ? null : new Intl.NumberFormat('ro-RO',{style:'currency',currency:'RON'}).format(p);
let CURRENT = null;

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }

async function load(){
  const products = await api('/api/products');
  const grid = $('#grid');
  grid.innerHTML = '';
  $('#empty').style.display = products.length ? 'none' : 'block';
  for(const p of products) grid.appendChild(card(p));
}

function card(p){
  const el = document.createElement('div');
  el.className = 'card';
  const price = p.min_price != null
    ? `<div class="price">${fmt(p.min_price)}</div>`
    : `<div class="price none">No price yet</div>`;
  const sugg = p.suggestion_count ? `<span class="badge">${p.suggestion_count} new</span>` : '';
  el.innerHTML = `
    <h3>${escapeHtml(p.query)} ${sugg}</h3>
    ${price}
    <div class="meta">min across ${p.listing_count} listing(s)</div>
    <div class="row">
      <button class="sm primary" onclick="openDetail('${p.id}')">Open</button>
      <button class="sm" onclick="scout('${p.id}')">Scout</button>
      <button class="sm" onclick="refresh('${p.id}')">Refresh</button>
      <button class="sm" onclick="delProduct('${p.id}')">Delete</button>
    </div>`;
  return el;
}

async function addProduct(){
  const q = $('#q').value.trim();
  if(!q) return;
  await api('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q})});
  $('#q').value='';
  await load();
}

async function delProduct(id){
  if(!confirm('Delete this product?')) return;
  await api('/api/products/'+id,{method:'DELETE'});
  load();
}

async function refresh(id){
  toast('Refreshing prices…');
  await api('/api/products/'+id+'/refresh',{method:'POST'});
  load();
  if(CURRENT===id) openDetail(id);
}

// ---- Scout modal: search + pin ----
async function scout(id){
  CURRENT = id;
  openModal(`<h2>Scouting…</h2><p class="muted">Searching market sites.</p>`);
  const found = await api('/api/products/'+id+'/search');
  renderScout(id, found);
}

function renderScout(id, found){
  let rows = found.length ? found.map(f => `
    <div class="result">
      <div>
        <div class="t">${escapeHtml(f.title)}</div>
        <div class="s">${f.site} · ${fmt(f.price)||'—'}</div>
      </div>
      <button class="sm ${f.pinned?'':'primary'}" ${f.pinned?'disabled':''}
        onclick='pin("${id}", ${JSON.stringify(f).replace(/'/g,"&#39;")}, this)'>
        ${f.pinned?'Pinned':'Pin'}</button>
    </div>`).join('') : '<p class="muted">No results found.</p>';
  openModal(`
    <button class="sm close" onclick="closeModal()">Close</button>
    <h2>Pin findings</h2>
    <p class="muted">Pin the listings that match what you want.</p>
    ${rows}
    <h3 style="margin-top:18px">Or pin a URL directly</h3>
    <div class="add-bar">
      <input id="manualUrl" type="text" placeholder="https://…">
      <button class="primary" onclick="pinUrl('${id}')">Pin URL</button>
    </div>`);
}

async function pin(id, listing, btn){
  btn.disabled = true; btn.textContent = '…';
  await api('/api/products/'+id+'/listings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(listing)});
  btn.textContent = 'Pinned';
  load();
}

async function pinUrl(id){
  const url = $('#manualUrl').value.trim();
  if(!url) return;
  toast('Fetching price…');
  await api('/api/products/'+id+'/listings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
  $('#manualUrl').value='';
  load();
  openDetail(id);
}

// ---- Detail modal: listings + suggestions ----
async function openDetail(id){
  CURRENT = id;
  const p = await api('/api/products/'+id);
  const listings = p.listings.length ? p.listings.map(l => `
    <div class="listing">
      <a href="${l.url}" target="_blank">${escapeHtml(l.title||l.url)}</a>
      <div>
        <span class="lp">${fmt(l.price)||'—'}</span>
        ${l.available===false?'<span class="oos"> · out of stock</span>':''}
        <span class="s muted"> · ${l.site||''}</span>
        <button class="sm" onclick='unpin("${id}","${l.url}")'>Unpin</button>
      </div>
    </div>`).join('') : '<p class="muted">No listings pinned yet. Use Scout to find some.</p>';

  const sugg = (p.suggestions||[]).length ? `
    <h3 style="margin-top:18px">New suggestions (${p.suggestions.length})</h3>
    ${p.suggestions.map(s => `
      <div class="result">
        <div><div class="t">${escapeHtml(s.title)}</div><div class="s">${s.site} · ${fmt(s.price)||'—'}</div></div>
        <div>
          <button class="sm primary" onclick='confirmSugg("${id}","${s.url}")'>Add</button>
          <button class="sm" onclick='dismissSugg("${id}","${s.url}")'>Dismiss</button>
        </div>
      </div>`).join('')}` : '';

  openModal(`
    <button class="sm close" onclick="closeModal()">Close</button>
    <h2>${escapeHtml(p.query)}</h2>
    <div class="price ${p.min_price==null?'none':''}">${p.min_price!=null?fmt(p.min_price):'No price yet'}</div>
    <p class="muted">Minimum across ${p.listing_count} listing(s)</p>
    <div class="row"><button class="sm" onclick="scout('${id}')">Scout more</button>
      <button class="sm" onclick="refresh('${id}')">Refresh prices</button></div>
    <h3 style="margin-top:18px">Pinned listings</h3>
    ${listings}
    ${sugg}`);
}

async function unpin(id,url){
  await api('/api/products/'+id+'/listings',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
  openDetail(id); load();
}
async function confirmSugg(id,url){
  await api('/api/products/'+id+'/suggestions/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
  openDetail(id); load();
}
async function dismissSugg(id,url){
  await api('/api/products/'+id+'/suggestions/dismiss',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});
  openDetail(id);
}

async function checkNotifications(){
  const n = await api('/api/notifications?clear=1');
  if(!n.length){ toast('No new updates.'); return; }
  const total = n.reduce((a,b)=>a+b.count,0);
  toast(`${total} new listing(s) across ${n.length} product(s). Open a product to review.`);
  load();
}

function openModal(html){ $('#modal').innerHTML = html; $('#modalBg').classList.add('open'); }
function closeModal(){ $('#modalBg').classList.remove('open'); CURRENT=null; }
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

load();
</script>
</body>
</html>
